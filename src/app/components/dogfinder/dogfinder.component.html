<p>dogfinder works!</p>
<mat-toolbar color="primary">
  <span>Dog Finder</span>
  <span class="spacer"></span>
  <button (click)="search('')">pets</button>
</mat-toolbar>

<mat-form-field>
  <input matInput type="text" [(ngModel)]="searchText" placeholder="Search for a dog breed">
</mat-form-field>

<div *ngIf="searchText">
  <h2>Search Results for "{{searchText}}"</h2>
  <ul>
    <li *ngFor="let breed of search(searchText)">
      {{ breed.name }}
      <img src={{breed.image_link}} alt="breed image">
    </li>
  </ul>
</div>
